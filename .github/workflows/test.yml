name: 🧪 Tests

on:
  push:
    branches:
      - testing-framework

jobs:

  build:
    name: 🏗️ Build AutoTx
    runs-on: windows-2022

    steps:

      # the full history (fetch-depth 0) is needed for the version number of the build,
      # lfs gets the real RoboSharp.dll instead of the placeholder file:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: "true"

      - name: 👷 Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: 🥇 Setup NuGet
        uses: NuGet/setup-nuget@v4.0

      # Cache the downloaded NuGet packages (NLog etc.) between runs, they only change
      # when one of the packages.config files changes:
      # Copied from release-build.yml, simplified
      - name: 💾 Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: packages
          key: nuget-${{ hashFiles('**/packages.config') }}

      - name: 🧬 Restore NuGet packages
        run: nuget restore AutoTx.sln

      - name: 🏗️ Build AutoTx
        run: .\Scripts\msbuild\build\release.cmd

      - name: 📦 Make the installation package
        run: .\Scripts\Make-Package.ps1
        shell: pwsh

      # hand the package over to the test job, which runs on another machine. Like in
      # release-build.yml, upload the zip (it keeps the empty "conf" and "var" folders),
      # without compressing it again:
      - name: 📤 Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: autotx-package
          path: Scripts/build/AutoTx-*_x64.zip
          compression-level: 0


  autotx-test:
    name: 🧪 Install and test AutoTx
    runs-on: windows-2022
    needs: build

    steps:

      # only needed for our test scripts, the build comes from the package:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Download the package
        uses: actions/download-artifact@v8
        with:
          name: autotx-package
          path: package

      - name: 📂 Unpack the package
        run: Expand-Archive -Path (Get-ChildItem package\*.zip)[0] -DestinationPath package
        shell: pwsh

      - name: 🔍 Show the package content
        run: Get-ChildItem -Recurse package
        shell: pwsh

      - name: 🖥️ Show runner information
        run: .\Tests\Show-RunnerInfo.ps1
        shell: pwsh

      - name: 📁 Create test folders
        run: .\Tests\New-TestFolders.ps1
        shell: pwsh

      - name: 🔧 Install AutoTx
        run: .\Tests\Install-AutoTx.ps1
        shell: pwsh

      - name: ▶️ Start AutoTx
        run: .\Tests\Start-AutoTx.ps1
        shell: pwsh

      - name: 📄 Copy a folder
        run: .\Tests\Test-CopyFolder.ps1
        shell: pwsh
